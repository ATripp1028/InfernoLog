# gitleaks — secret scanning for this public repo. Runs in CI on every pull
# request (.github/workflows/ci.yml), alongside GitHub's own secret scanning
# and push protection, which match known provider token formats. gitleaks's
# default rules add the generic cases GitHub's provider patterns miss:
# hardcoded passwords, API keys and private keys.
#
# ⚠️ CREDENTIALS — see CLAUDE.md "Credential handling". Never allowlist a real
# value to make this pass: remove it from the code, rotate it, and purge it
# from history.

title = "InfernoLog"

[extend]
useDefault = true

[[allowlists]]
description = "Leak-test sentinels: obviously fake credentials, generated by leakSentinel() in apps/api/src/test/captureLeaks.ts and used as fixtures in credential tests"
regexes = ['''Leak-Canary-[A-Za-z0-9!_-]*''']

# gitleaks's default rules match known token formats (AWS, Stripe, GitHub,
# private keys) but not a plain password assigned in code or an env file —
# verified: `const dbPassword = "…"` passes the defaults untouched. These two
# rules close that gap for credential-named variables, fields, and env keys.
# Entropy keeps prose and placeholders out; test fixtures use `Leak-Canary-`
# sentinels, which the allowlist above exempts.

[[rules]]
id = "infernolog-hardcoded-credential"
description = "A credential-named variable or field assigned a string literal"
regex = '''(?i)[\w.$-]*(?:password|passwd|pwd|verificationcode)[\w.$-]*["'`]?\s*(?:===?|!==?|:=|=>|[:=])\s*["'`]([^"'`\s]{8,})["'`]'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "pwd", "verificationcode"]

[[rules.allowlists]]
description = "PASSWORD_SYMBOLS in packages/core: Cognito's symbol list, not a password"
regexTarget = "line"
regexes = ['''export const PASSWORD_SYMBOLS\s*=''']

[[rules]]
id = "infernolog-hardcoded-credential-env"
description = "A credential-named environment variable given a value"
regex = '''(?im)^\s*(?:export\s+)?[A-Z0-9_]*(?:PASSWORD|PASSWD|PWD|VERIFICATION_CODE_SECRET)[A-Z0-9_]*\s*=\s*["']?([^\s"']{8,})'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "pwd", "verification_code_secret"]
