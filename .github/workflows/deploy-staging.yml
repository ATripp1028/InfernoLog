name: Deploy Staging

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy to staging'
        required: true
        default: 'develop'

# Serialize all staging deploys into one group: every PR deploys to the same
# shared `staging` stage, so a per-PR group would let two PRs run `sst deploy`
# against the same SST app concurrently and collide on the state lock.
# cancel-in-progress must stay false so an in-flight deploy is never killed
# mid-update, which would leave an orphaned SST lock.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  deployments: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'packages/tsconfig/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/deploy-api.yml'
              - '.github/workflows/deploy-staging.yml'
            web:
              - 'apps/web/**'
              - 'packages/core/**'
              - 'packages/tsconfig/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/deploy-web.yml'
              - '.github/workflows/deploy-staging.yml'

  deploy-api-staging:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/deploy-api.yml
    with:
      stage: staging
      environment: staging
    secrets: inherit

  deploy-web-staging:
    needs: [changes, deploy-api-staging]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true') &&
      (needs.deploy-api-staging.result == 'success' || needs.deploy-api-staging.result == 'skipped')
    uses: ./.github/workflows/deploy-web.yml
    with:
      stage: staging
      environment: staging
    secrets: inherit

  verify-staging:
    runs-on: ubuntu-latest
    needs: [deploy-api-staging, deploy-web-staging]
    if: |
      always() &&
      (needs.deploy-api-staging.result == 'success' || needs.deploy-api-staging.result == 'skipped') &&
      (needs.deploy-web-staging.result == 'success' || needs.deploy-web-staging.result == 'skipped') &&
      (needs.deploy-api-staging.result == 'success' || needs.deploy-web-staging.result == 'success')
    steps:
      - name: Verify staging health
        run: |
          API_URL=$(aws ssm get-parameter \
            --name /infernolog/staging/api-url \
            --query Parameter.Value \
            --output text \
            --region us-east-1)
          # Strip trailing slash so we don't end up with double slashes
          API_URL=${API_URL%/}
          echo "Health-checking ${API_URL}/health"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/health")
          if [ "$RESPONSE" != "200" ]; then
            echo "Staging health check failed with status $RESPONSE"
            exit 1
          fi
          echo "Staging health check passed"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

  # The E2E suite is a post-deploy gate, not a PR gate: it drives the shared
  # staging environment, so it only runs once something actually landed there.
  # See docs/E2E_TESTING.md, "Where it runs".
  e2e-staging:
    needs: verify-staging
    uses: ./.github/workflows/e2e.yml
    with:
      stage: staging
      environment: staging
    secrets: inherit
