name: Deploy Staging

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy to staging'
        required: true
        default: 'develop'

concurrency:
  group: deploy-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  deployments: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'packages/tsconfig/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/deploy-api.yml'
              - '.github/workflows/deploy-staging.yml'
            web:
              - 'apps/web/**'
              - 'packages/core/**'
              - 'packages/tsconfig/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/deploy-web.yml'
              - '.github/workflows/deploy-staging.yml'

  deploy-api-staging:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/deploy-api.yml
    with:
      stage: staging
      environment: staging
    secrets: inherit

  deploy-web-staging:
    needs: [changes, deploy-api-staging]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true') &&
      (needs.deploy-api-staging.result == 'success' || needs.deploy-api-staging.result == 'skipped')
    uses: ./.github/workflows/deploy-web.yml
    with:
      stage: staging
      environment: staging
    secrets: inherit

  verify-staging:
    runs-on: ubuntu-latest
    needs: [deploy-api-staging, deploy-web-staging]
    if: |
      always() &&
      (needs.deploy-api-staging.result == 'success' || needs.deploy-api-staging.result == 'skipped') &&
      (needs.deploy-web-staging.result == 'success' || needs.deploy-web-staging.result == 'skipped') &&
      (needs.deploy-api-staging.result == 'success' || needs.deploy-web-staging.result == 'success')
    steps:
      - name: Verify staging health
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://$(aws ssm get-parameter \
              --name /infernolog/staging/api-url \
              --query Parameter.Value \
              --output text \
              --region us-east-1)/health)
          if [ "$RESPONSE" != "200" ]; then
            echo "Staging health check failed with status $RESPONSE"
            exit 1
          fi
          echo "Staging health check passed"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
