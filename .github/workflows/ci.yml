name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # Matches the Lambda runtime pinned in apps/api/infra/defaults.ts. These
      # must move together: the API's tests are only meaningful as a gate if
      # they run on the Node (and bundled undici) production actually runs.
      # Note Node 26+ breaks the web suite — it exposes Web Storage unflagged,
      # which collides with jsdom's localStorage — so bumping past 24 means
      # sorting that out first.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Build
        run: pnpm turbo run build
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      # apps/api/infra/** is typechecked separately: it needs the SST platform
      # types under .sst/, which are gitignored and only exist after
      # `sst install`. No AWS credentials required — this just downloads the
      # platform and the aws provider.
      - name: Install SST platform
        run: pnpm --filter @infernolog/api exec sst install

      - name: Typecheck infra
        run: pnpm turbo run typecheck:infra

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # Keep in step with the `ci` job above and the pinned Lambda runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs both vitest projects: unit (mocked) and integration (real Postgres).
      # The integration globalSetup starts/stops the test database itself via
      # docker-compose.test.yml — ubuntu-latest ships Docker + `docker compose`.
      #
      # Coverage is on so the thresholds in apps/api/vitest.config.ts are
      # actually enforced. They assume BOTH projects ran, so this has to be the
      # full `test:coverage`, not a single --project run.
      - name: Run API tests with coverage
        run: pnpm --filter @infernolog/api test:coverage
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      # Everything except the API, which ran above. Negated filter rather than
      # naming apps/web, so a new workspace's tests get picked up on their own.
      - name: Run remaining tests
        run: pnpm turbo run test --filter='!@infernolog/api'
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
